name: Festival Auto Schedule

on:
  schedule:
    # 每天 08:05（北京时间，UTC+8）= 00:05 UTC
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  festival:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 按日历计算节日开关
        id: festival
        run: |
          node scripts/festival-schedule.mjs | tee /tmp/festival.log
          echo "summary=$(tail -n 1 /tmp/festival.log)" >> "$GITHUB_OUTPUT"

      - name: 有变化才提交并推送（推送会触发 Vercel 重新部署）
        run: |
          if git diff --quiet -- src/data/festival.json; then
            echo "节日开关无需变更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/festival.json
          git commit -m "chore(festival): ${{ steps.festival.outputs.summary }}"
          git pull --rebase origin main
          git push origin main
